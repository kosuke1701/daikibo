[build-system]
requires = []
build-backend = "tools.standardbuild"
backend-path = ["."]

[project]
name = "daikibo-dev"
version = "1.0.0.dev31"
description = "Evidence-bound local workflow control for large-scale agentic development"
requires-python = ">=3.13,<3.14"
license = "MIT"
readme = "README.md"
dependencies = [
  "tree-sitter==0.26.0",
  "tree-sitter-python==0.25.0",
  "tree-sitter-javascript==0.25.0",
  "tree-sitter-typescript==0.23.2",
  "tree-sitter-go==0.25.0",
  "tree-sitter-rust==0.24.2",
  "tree-sitter-java==0.23.5",
  "tree-sitter-c==0.24.2",
  "tree-sitter-cpp==0.23.4",
  "tree-sitter-c-sharp==0.23.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
daikibo = "daikibo.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
